<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | ShopEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-login" data-protected="" data-nav="">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#111827,#312e81);padding:20px">
  <div class="card" style="width:100%;max-width:430px">
    <a class="logo" href="index.html" style="margin-bottom:14px">🛠️ Shop<span>Ease</span> Admin</a>
    <h1 style="font-size:1.6rem">Administrator login</h1><p class="sub" style="color:#6b7280;margin-bottom:20px">Sign in to manage the store.</p>
    <div id="msg"></div>
    <form id="adminLoginForm" novalidate>
      <div class="form-group"><label for="email">Email</label><input class="form-control" id="email" type="email" required></div>
      <div class="form-group"><label for="password">Password</label><input class="form-control" id="password" type="password" required></div>
      <button class="btn btn-block" type="submit">Login to Admin Panel</button>
    </form>
    <div class="demo-box"><b>Demo admin:</b> admin@shop.com / Admin@123</div>
    <p class="auth-foot"><a href="index.html">← Back to store</a></p>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
