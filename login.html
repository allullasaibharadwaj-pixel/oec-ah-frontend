<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ShopEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" data-protected="" data-nav="">
<div id="site-header"></div>
<main class="container page">

<div class="auth-wrap card">
  <h1>Welcome back</h1><p class="sub">Log in to continue shopping.</p>
  <div id="msg"></div>
  <form id="loginForm" novalidate>
    <div class="form-group"><label for="email">Email</label><input class="form-control" id="email" type="email" placeholder="you@example.com" required></div>
    <div class="form-group"><label for="password">Password</label><input class="form-control" id="password" type="password" placeholder="Your password" required></div>
    <button class="btn btn-block" type="submit">Login</button>
  </form>
  <p class="auth-foot">New here? <a href="register.html">Create an account</a></p>
  <div class="demo-box"><b>Demo customer:</b> user@shop.com / User@123</div>
</div>

</main>
<div id="site-footer"></div>
<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
