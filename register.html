<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ShopEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register" data-protected="" data-nav="">
<div id="site-header"></div>
<main class="container page">

<div class="auth-wrap card" style="max-width:560px">
  <h1>Create your account</h1><p class="sub">Join ShopEase in less than a minute.</p>
  <div id="msg"></div>
  <form id="registerForm" novalidate>
    <div class="form-group"><label for="name">Full name</label><input class="form-control" id="name" placeholder="John Doe" required></div>
    <div class="form-group"><label for="email">Email</label><input class="form-control" id="email" type="email" placeholder="you@example.com" required></div>
    <div class="form-row">
      <div class="form-group"><label for="password">Password</label><input class="form-control" id="password" type="password" placeholder="Min. 6 characters" required></div>
      <div class="form-group"><label for="confirm">Confirm password</label><input class="form-control" id="confirm" type="password" placeholder="Repeat password" required></div>
    </div>
    <div class="form-group"><label for="phone">Phone number</label><input class="form-control" id="phone" type="tel" placeholder="e.g. 9876543210" required><div class="form-hint">10-15 digits, optional + prefix</div></div>
    <div class="form-group"><label for="address">Address</label><textarea class="form-control" id="address" placeholder="House no, street, city, postal code" required></textarea></div>
    <button class="btn btn-block" type="submit">Register</button>
  </form>
  <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
</div>

</main>
<div id="site-footer"></div>
<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
