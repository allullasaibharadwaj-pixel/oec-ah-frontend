<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product | ShopEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-edit" data-protected="admin" data-nav="products">
<div class="admin-layout">
<aside class="admin-side" id="admin-side"></aside>
<main class="admin-main">
<div class="admin-title"><h1>Edit Product</h1></div>
<div class="card" style="max-width:820px">
  <div id="msg"></div>
  <form id="productForm" novalidate>
    <div class="form-row">
      <div class="form-group"><label for="pName">Product name *</label><input class="form-control" id="pName" required></div>
      <div class="form-group"><label for="pBrand">Brand</label><input class="form-control" id="pBrand"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label for="pCategory">Category *</label><select class="form-control" id="pCategory" required></select></div>
      <div class="form-group"><label for="pStock">Stock quantity *</label><input class="form-control" id="pStock" type="number" min="0" step="1" required></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label for="pPrice">Price *</label><input class="form-control" id="pPrice" type="number" min="0.01" step="0.01" required></div>
      <div class="form-group"><label for="pOldPrice">Old price (optional, shows SALE badge)</label><input class="form-control" id="pOldPrice" type="number" min="0.01" step="0.01"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label for="pRating">Rating (0-5)</label><input class="form-control" id="pRating" type="number" min="0" max="5" step="0.1" value="4"></div>
      <div class="form-group"><label for="pImage">Image URL</label><input class="form-control" id="pImage" placeholder="https://... or images/products/name.svg"><div class="form-hint">Leave empty to use a placeholder image.</div></div>
    </div>
    <div class="form-group"><label for="pDesc">Description</label><textarea class="form-control" id="pDesc" rows="4"></textarea></div>
    <div class="form-group"><label>Image preview</label><div><img id="preview" class="thumb" style="width:110px;height:110px" src="images/placeholder.svg" alt="preview"></div></div>
    <div style="display:flex;gap:10px"><button class="btn" type="submit" id="saveBtn">Save Product</button><a class="btn btn-ghost" href="admin-products.html">Cancel</a></div>
  </form>
</div>

</main>
</div>
<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/admin-products.js"></script>
</body>
</html>
